# SRS Configuration for Live Style Studio
# Handles WebRTC ingestion and RTMP forwarding to Twitch

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP Server for console and players
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# HTTP API for WebRTC and management
http_api {
    enabled         on;
    listen          1985;
}

# Stats for monitoring
stats {
    network         0;
}

# WebRTC Server
rtc_server {
    enabled         on;
    listen          8000;
    # Use Docker internal hostname or set via environment variable
    candidate       $CANDIDATE;
}

# Default vhost
vhost __defaultVhost__ {
    # Enable WebRTC
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    # Enable HLS for playback/preview
    hls {
        enabled         on;
        hls_fragment    10;
        hls_window      60;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # HTTP remux for HTTP-FLV
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # DVR for recording (optional)
    dvr {
        enabled      off;
        dvr_path     ./objs/nginx/html/[app]/[stream].[timestamp].flv;
        dvr_plan     session;
    }

    # Forward to Twitch RTMP
    # Note: Stream key will be part of the stream name
    # Format: rtc://localhost/live/{streamKey}
    forward {
        enabled on;
        destination rtmp://live.twitch.tv/app/[stream];
    }
}
